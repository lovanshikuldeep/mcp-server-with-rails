# Training data for the blog assistant's intent classifier.
#
# Add example sentences under an intent, then retrain:
#   bin/rails chatbot:train      # train and save storage/chatbot/model.json
#   bin/rails chatbot:evaluate   # leave-one-out accuracy and misclassified examples
#
# The app also retrains automatically when this file is newer than the saved model.
# Titles, bodies, quoted text and search terms are stripped before training, so
# examples can use realistic values.
intents:
  greeting:
    examples:
      - hi
      - hello
      - hey
      - hey there
      - hello there
      - hi bot
      - good morning
      - good afternoon
      - good evening
      - howdy
      - hiya
      - greetings
      - yo
      - hi, how are you?
      - how are you doing
      - what's up
      - hi there
      - hey bot
      - hello assistant
      - morning
      - good day
      - hey, how's it going

  goodbye:
