# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
# Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DATABASE_PORT") { 5432 } %>
  username: developer
  password: developer

development:
  <<: *default
  database: mcp_with_blog_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: mcp_with_blog_test

# In production, set DATABASE_URL or the DATABASE_* variables below.
production:
  primary:
    <<: *default
    database: mcp_with_blog_production
  cache:
    <<: *default
    database: mcp_with_blog_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: mcp_with_blog_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: mcp_with_blog_production_cable
    migrations_paths: db/cable_migrate
